# Multidevice Remote — Coturn STUN/TURN Configuration
# PC B: turn.agoy507.my.id → 168.110.216.221

listening-port=3478
# TLS tidak dipakai (Cloudflare Tunnel handle TLS untuk signaling)
# tls-listening-port=5349

# Ephemeral HMAC-SHA1 credentials — secret dipass via docker-compose args
use-auth-secret
lt-cred-mech

realm=turn.agoy507.my.id
fingerprint

# IP publik PC B — override via docker-compose --external-ip
# external-ip=168.110.216.221

# Security: blokir relay ke loopback / private subnet
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1

# FIX: Hapus denied-peer-ip untuk 168.110.216.221 agar coturn bisa
# melakukan relay ke IP publik dirinya sendiri (self-loopback detection).
# external-ip sudah handle ini via NAT mapping.
# allowed-peer-ip=168.110.216.221   # tidak perlu jika external-ip sudah benar

# Relay port range — sesuai firewalld: 49160-49200/udp
min-port=49160
max-port=49200

# Logging
log-file=stdout
simple-log
