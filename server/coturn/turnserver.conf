# KendaliP2P Coturn STUN/TURN Configuration
listening-port=3478
tls-listening-port=5349

# Use ephemeral HMAC-SHA1 credentials generated by the Node.js signaling container
use-auth-secret
lt-cred-mech

# Override via docker-compose environment or turnserver args in production
realm=kendalip2p.local
fingerprint

# Security & SSRF protection: prevent relaying to loopback or private LAN subnets from external peers
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1

# Relay port range (must match docker-compose port mapping)
min-port=49152
max-port=49252

# Logging to stdout for container observability
log-file=stdout
simple-log
